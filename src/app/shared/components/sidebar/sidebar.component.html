<!--IMAGEN Y DATOS-->
<section class="flex flex-col h-full px-8">
  <div class="flex flex-row gap-3 mt-12 ">
    <img class="rounded-full" height="26"
         ngSrc="/assets/img/profilepicgmail.jpg" width="50">
    <div class="flex flex-col justify-start">
      <span>{{ username() }}</span>
      <span>{{ email() }}</span>
    </div>
  </div>
  <div class="mt-8">
    <input [placeholder]="'Buscar'" class="text-black w-full rounded-full pl-2" matInput>
    <!--    <mat-icon matSuffix>mode_edit</mat-icon>-->
  </div>
  <div class="mt-8 flex-grow">
    <app-task-list></app-task-list>
  </div>
</section>
